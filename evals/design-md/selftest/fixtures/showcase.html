<!doctype html>
<html lang="th"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Neon harness validation showcase</title>
<style>
:root{--color-white:#ffffff;--color-text-primary:#000000d9;--color-text-secondary:#000000a6;--color-text-on-color:#ffffff;--color-text-on-brand:#000000d9;--color-border-subtle:#0000000d;--color-border-strong:#01172b;--color-focus:#6968ef;--color-background-primary:#ffffff;--color-background-secondary:#f2f2f2;--color-button-primary:#01172b;--color-button-primary-hover:#1a2e40;--color-button-primary-active:#344555;--color-button-highlight:#f2f93c;--color-button-highlight-hover:#f4fa59;--color-button-highlight-active:#f5fb6d;--palette-yellow-25:#fcfece;--palette-yellow-50:#f9fc9e;--palette-yellow-75:#f5fb6d;--palette-yellow-100:#f2f93c;--palette-navy-25:#c0c5ca;--palette-navy-50:#808b95;--palette-navy-75:#415160;--palette-navy-100:#01172b;--palette-light-grey-25:#e9eff2;--palette-light-grey-50:#d3dfe6;--palette-light-grey-75:#bccfd9;--palette-light-grey-100:#a6bfcc;--asset-cryptocurrency:#8f0606;--asset-crowdfunding:#d60808;--asset-p2p-lending:#ba4a0a;--asset-thai-equity:#1211ad;--asset-equity:#aa46c3;--asset-mutual-fund:#01172b;--asset-gold:#f1f92d;--asset-tax-saving:#50cfff;--asset-esavings:#40ed90;--asset-cash:#007435;--tier-finnomena-club:#ffffff;--tier-finnomena-exclusive:#f2f93c;--tier-finnomena-private:#a6bfcc;--tier-finnomena-ultra:#01172b}*{box-sizing:border-box}body{margin:0;color:#01172b;font:17px/1.4 sans-serif}button,input,select{font:inherit;padding:12px;border:1px solid #aaa;border-radius:8px;background:white;color:inherit}button{cursor:pointer}button[aria-pressed=true]{background:#e8e8fa}a{color:#1817e7}h1{font-size:28px}h2{font-size:22px}p{margin:12px 0}.shell{display:flex;height:100dvh;--side:320px;--fixed:360px;--column:360px;--gap:16px}.sidebar{width:var(--side);flex:none;border-right:1px solid #eee;padding:16px;overflow:auto}.sidebar nav{display:grid;gap:16px}.content{flex:1;min-width:0;overflow:auto}.toolbar{height:64px;padding:12px;border-bottom:1px solid #eee}.area{padding:24px}.inspector{width:var(--fixed);flex:none;padding:24px;overflow:auto;border-left:1px solid #eee}.detailed .content{flex:none;width:var(--fixed)}.detailed .inspector{flex:1;min-width:320px}.records{display:grid;gap:12px}.records button{text-align:left}.primary{background:#01172b;color:white}.mobile-header,.bottom{display:none}.immersive .content{width:100%;height:100%;overflow:auto}.hero{padding:64px 24px;max-width:1000px;margin:auto}.hero img{max-width:100%;height:auto}.hero h1{font-size:60px}.bottom{position:fixed;bottom:0;width:100%;height:64px;background:white;border-top:1px solid #ddd;padding:12px}.bottom a{font-size:12px}.back{display:none}
@media(min-width:1440px){.shell{--gap:24px;--fixed:400px;--column:400px}.detailed,.simple{--side:360px}}
@media(min-width:1920px){.shell{--fixed:560px;--column:560px}.simple{--side:320px}}
@media(min-width:1080px) and (max-width:1271px){.shell{--side:240px}}
@media(min-width:500px) and (max-width:1079px){.shell{--side:64px;--column:320px}.sidebar{padding:8px}.sidebar a{font-size:11px;overflow-wrap:anywhere}}
@media(max-width:987px){.shell{--fixed:320px}.inspector{display:none}.detailed .content{flex:1;width:auto}.shell.detail-open .content{display:none}.shell.detail-open .inspector{display:block;flex:1;width:auto}.back{display:block}}
@media(max-width:499px){.shell{--side:0px;--column:320px;--gap:16px;height:calc(100dvh - 64px);padding-top:64px}.sidebar{display:none}.mobile-header{display:block;position:fixed;top:0;height:64px;padding:16px;background:white;width:100%;z-index:1}.bottom{display:flex;justify-content:space-around}.area{padding:16px}.immersive{padding-top:0;height:100dvh}.hero h1{font-size:34px}}
</style>
<div id="app"></div>
<script>
const app=document.querySelector('#app'),route=location.pathname.slice(1),routes=['detailed','content','simple','immersive'];
const labels=['คำสั่งซื้อ','รายงาน','กองทุนที่บันทึก','เริ่มวางแผน'];
const names=['กองทุนหุ้นไทย','กองทุนตราสารหนี้','กองทุนหุ้นโลก'];
const columns=['inbox','reviewing','comparing','shortlisted','archived'];
const columnLabels=['Inbox','Reviewing','Comparing','Shortlisted','Archived'];
const cards=Array.from({length:45},(_,i)=>({id:'r'+i,column:columns[i%5],name:'บทวิเคราะห์กองทุน '+(i+1)}));
let selected=0,detail=false,state=new URLSearchParams(location.search).get('state')||'populated';
function logo(icon=false){return `<img data-testid="brand-logo" alt="Finnomena" width="${icon?32:136}" height="32" src="https://raw.githubusercontent.com/pawisssh/neon/main/templates/vitejs-cds/src/assets/logo/logo-finnomena-${icon?'icon':'text'}-light.svg">`}
function nav(){return routes.slice(0,3).map((r,i)=>`<a href="/${r}">${labels[i]}</a>`).join('')}
function shell(content){app.innerHTML=`<main data-testid="screen" data-layout="${route}" data-state="${state}" class="shell ${route} ${detail?'detail-open':''}">${route!=='immersive'?`<header class="mobile-header">${logo()}</header><aside data-testid="sidebar" class="sidebar">${logo(innerWidth<1080)}<nav>${nav()}</nav></aside>`:''}${content}${route!=='immersive'?`<nav data-testid="bottom-nav" class="bottom">${nav()}</nav>`:''}</main>`}
function details(){return `<aside data-testid="inspector" data-selected-id="item${selected}" class="inspector"><button class="back" data-testid="detail-back" onclick="detail=false;render()">กลับ</button><h2>${names[selected]}</h2><p>ข้อมูลตัวอย่าง</p><p>มูลค่า 12,500 บาท</p><p>เลขอ้างอิง item${selected}</p><button class="primary" data-testid="primary-action" onclick="this.textContent='บันทึกแล้ว'">บันทึก</button></aside>`}
function render(){
 if(!routes.includes(route)){app.innerHTML='<h1>Neon layout showcase</h1>'+routes.map((r,i)=>`<p><a href="/${r}">${labels[i]}</a></p>`).join('');return}
 if(route==='immersive'){shell(`<section data-testid="content-pane" class="content"><header data-testid="logo-header" class="toolbar">${logo()}</header><section class="hero"><p data-testid="tier-label">Finnomena Exclusive</p><h1>เริ่มวางแผนการลงทุน</h1><p>กำหนดเป้าหมายและระยะเวลาที่เหมาะกับคุณ</p><a data-testid="primary-action" class="primary" href="#proof-block">เริ่มต้น</a><figure data-testid="media-frame"><img alt="ภาพตัวอย่างการลงทุน" src="https://picsum.photos/seed/finnomena/640/360"></figure><section id="proof-block" data-testid="proof-block"><h2>กำหนดเป้าหมาย</h2><p>ข้อมูลนี้เป็นตัวอย่างสำหรับทดสอบหน้าจอ</p></section><section data-testid="multi-asset-visual"><p data-asset-category="cryptocurrency" style="color:var(--asset-cryptocurrency)">คริปโตเคอร์เรนซี · 8%</p><p data-asset-category="crowdfunding" style="color:var(--asset-crowdfunding)">คราวด์ฟันดิง · 4%</p><p data-asset-category="p2p-lending" style="color:var(--asset-p2p-lending)">P2P lending · 3%</p><p data-asset-category="thai-equity" style="color:var(--asset-thai-equity)">หุ้นไทย · 20%</p><p data-asset-category="equity" style="color:var(--asset-equity)">หุ้นต่างประเทศ · 20%</p><p data-asset-category="mutual-fund" style="color:var(--asset-mutual-fund)">กองทุนรวม · 10%</p><p data-asset-category="gold" style="color:var(--asset-gold)">ทองคำ · 10%</p><p data-asset-category="tax-saving" style="color:var(--asset-tax-saving)">กองทุนลดหย่อนภาษี · 5%</p><p data-asset-category="esavings" style="color:var(--asset-esavings)">e-Savings · 5%</p><p data-asset-category="cash" style="color:var(--asset-cash)">เงินสด · 15%</p></section></section><footer data-testid="compact-footer">ข้อมูลตัวอย่าง</footer></section>`);return}
 if(state!=='populated'){shell(`<section data-testid="content-pane" class="content area"><h1>${labels[routes.indexOf(route)]}</h1><p data-testid="state-${state}">${{loading:'กำลังโหลด',empty:'ยังไม่มีข้อมูล',error:'โหลดข้อมูลไม่สำเร็จ'}[state]}</p><button data-testid="state-reset" onclick="state='populated';history.replaceState({},'',location.pathname);render()">โหลดข้อมูลตัวอย่าง</button></section>`);return}
 if(route==='simple'){shell(`<section data-testid="content-pane" class="content area"><h1>กองทุนที่บันทึก</h1><label>ค้นหา <input data-testid="watchlist-search" oninput="filter(this.value)"></label><div data-testid="data-region" id="funds"></div></section>`);filter('');return}
 const hook=route==='detailed'?'order-item':'holding-item';
 shell(`<section data-testid="content-pane" class="content"><header class="toolbar">${labels[routes.indexOf(route)]}</header><div class="area"><h1>ข้อมูลตัวอย่าง</h1><div data-testid="data-region" class="records">${names.map((n,i)=>`<button data-testid="${hook}" data-id="item${i}" data-name="${n}" aria-pressed="${selected===i}" onclick="selected=${i};detail=true;render()">${n}<p>12,500 บาท · 10/09/2026</p></button>`).join('')}</div></div></section>${details()}`)
}
function filter(value){document.querySelector('#funds').innerHTML=names.filter(n=>n.includes(value)).map(n=>`<p data-testid="watchlist-item" data-name="${n}">${n}</p>`).join('')}
function move(id,c){cards.find(x=>x.id===id).column=c;render()}
render();
</script></html>
