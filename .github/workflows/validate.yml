name: Validate Neon
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test evals/skills/*.test.mjs
      - run: node scripts/check-repository.mjs
  template-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            evals/templates/package-lock.json
            templates/vitejs-cds/package-lock.json
      - run: npm ci --prefix evals/templates
      - run: npx --prefix evals/templates playwright install --with-deps chromium
      - run: npm test --prefix evals/templates
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: template-browser-results
          path: .local/evals/templates/
          if-no-files-found: ignore
          include-hidden-files: true
